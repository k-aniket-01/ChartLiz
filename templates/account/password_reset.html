<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ChartLiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#0d0d0f; color:#e8e6de; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .auth-card { background:#141416; border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:40px; width:100%; max-width:400px; }
    .auth-brand { text-align:center; margin-bottom:28px; }
    .auth-brand i { font-size:28px; color:#3b82f6; }
    .auth-brand h2 { font-size:20px; font-weight:700; margin-top:8px; color:#fff; }
    .auth-brand p { font-size:13px; color:#6b6966; margin-top:4px; line-height:1.6; }
    .form-label { font-size:13px; color:#9c9a94; margin-bottom:6px; }
    .form-control { background:#0d0d0f; border:1px solid rgba(255,255,255,0.1); color:#e8e6de; border-radius:8px; padding:10px 14px; font-size:14px; width:100%; }
    .form-control:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.15); }
    .btn-reset { width:100%; padding:12px; background:#3b82f6; border:none; border-radius:8px; color:#fff; font-size:14px; font-weight:500; cursor:pointer; }
    .btn-reset:hover { background:#2563eb; }
    .auth-footer { text-align:center; margin-top:20px; font-size:13px; color:#6b6966; }
    .auth-footer a { color:#3b82f6; text-decoration:none; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-brand">
    <i class="bi bi-lock"></i>
    <h2>Reset your password</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="form-label">Email address</label>
      {{ form.email }}
    </div>
    <button type="submit" class="btn-reset">Send reset link</button>
  </form>
  <div class="auth-footer">
    <a href="/accounts/login/">← Back to login</a>
  </div>
</div>
<script>
  document.querySelector('input[type=email]')?.classList.add('form-control');
</script>
</body>
</html>
