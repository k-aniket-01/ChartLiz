{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google — ChartLiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#0d0d0f; color:#e8e6de; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .card { background:#141416; border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:48px 40px; width:100%; max-width:400px; text-align:center; }
    .brand { margin-bottom:32px; }
    .brand i { font-size:28px; color:#3b82f6; }
    .brand h2 { font-size:20px; font-weight:700; color:#fff; margin-top:8px; }
    .brand p { font-size:13px; color:#6b6966; margin-top:6px; }
    .google-icon { width:48px; height:48px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
    .provider-name { font-size:16px; font-weight:600; color:#fff; margin-bottom:8px; }
    .confirm-text { font-size:13px; color:#6b6966; line-height:1.6; margin-bottom:28px; }
    .btn-continue { display:block; width:100%; padding:13px; background:#3b82f6; border:none; border-radius:8px; color:#fff; font-size:14px; font-weight:500; cursor:pointer; text-decoration:none; transition:background 0.2s; }
    .btn-continue:hover { background:#2563eb; color:#fff; }
    .btn-cancel { display:block; margin-top:12px; font-size:13px; color:#6b6966; text-decoration:none; }
    .btn-cancel:hover { color:#e8e6de; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <i class="bi bi-bar-chart-line-fill"></i>
    <h2>ChartLiz</h2>
    <p>You're signing in via Google</p>
  </div>

  <div class="google-icon">
    <svg width="24" height="24" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
  </div>

  <div class="provider-name">Continue with Google</div>
  <div class="confirm-text">
    You are about to sign in to ChartLiz using your Google account.
    This is safe and we never post anything without your permission.
  </div>

  <form method="post" action="{% url 'socialaccount_login' provider.id %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-continue">Continue with Google</button>
  </form>

  <a href="/accounts/login/" class="btn-cancel">← Back to login</a>
</div>
</body>
</html>
