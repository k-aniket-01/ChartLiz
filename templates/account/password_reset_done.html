<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check your email — ChartLiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#0d0d0f; color:#e8e6de; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,sans-serif; }
    .auth-card { background:#141416; border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:48px 40px; width:100%; max-width:400px; text-align:center; }
    .icon-circle { width:64px; height:64px; background:rgba(62,207,142,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:28px; }
    h2 { font-size:22px; font-weight:700; color:#fff; margin-bottom:12px; }
    p { font-size:14px; color:#6b6966; line-height:1.7; }
    .btn-back { display:inline-block; margin-top:28px; padding:10px 28px; background:#3b82f6; color:#fff; border-radius:8px; text-decoration:none; font-size:14px; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="icon-circle">✉️</div>
  <h2>Check your email</h2>
  <p>We've sent a password reset link to your email address. Click the link in the email to reset your password.</p>
  <a href="/accounts/login/" class="btn-back">Back to login</a>
</div>
</body>
</html>
